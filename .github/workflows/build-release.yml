# =============================================================================
# BUILD & RELEASE
# =============================================================================
#
# This workflow is the project's only compiler.
#
# The development environment for this repository deliberately has no Android
# SDK and no Gradle daemon, so nothing here can be built — or even type-checked
# — locally. Every claim that "the project compiles" is therefore backed by a
# green run of this file and by nothing else.
#
# The app is FlorisBoard (Apache-2.0) rebranded and extended into Nepali
# Keyboard — see AGENTS.md. That has two consequences for this file:
#
#   * No Python source gates. tools/kotlin_lint.py and tools/kotlin_refcheck.py
#     encode the conventions of the previous hand-written engine (package/dir
#     rules, scaffold markers, a closed-world name allow-list). The upstream
#     tree legitimately violates all three, so the gates do not run here.
#     They return if/when our own engine packages land with their own rules.
#   * The native toolchain. :lib:native builds Rust through CMake, so this
#     workflow provisions CMake (lukka/get-cmake) and relies on the runner's
#     preinstalled Rust + AGP's automatic NDK install — exactly what
#     FlorisBoard's own CI does. JDK 17 likewise matches upstream.
#
# It runs on:
#   * every push to any branch (when build inputs change — see paths below)
#   * every pull request            — the gate
#   * workflow_dispatch             — for an on-demand build from any branch
#
# Every successful push build is also published as a GitHub Release so the
# in-app updater can discover it: `main` builds as a full release, any other
# branch as a prerelease. The updater queries `releases/latest`, which GitHub
# resolves to the newest *full* release — so branch builds are downloadable
# without ever being offered as auto-updates. Pull-request builds publish
# nothing: a PR from a fork must never touch releases.
#
# The job produces exactly ONE release APK, signed with the checked-in demo key.
# See the "Release signing" section of AGENTS.md for why that is safe and what
# its limits are.
# =============================================================================

name: Build release APK

on:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'libnative/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-release.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'libnative/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

# Least privilege. The build job only reads the repository and uploads an
# artifact; publishing a Release needs `contents: write`, which is granted
# solely to the release job below — never to the steps that compile code.
permissions:
  contents: read

# A push that supersedes an in-flight build for the same branch cancels the
# older one. Release builds are slow (native code, minify, resource shrink)
# and a superseded run's artifact is by definition not what anyone wants.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.rename.outputs.version }}
      short_sha: ${{ steps.rename.outputs.short_sha }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # JDK 17 (matches upstream FlorisBoard CI)
      # -----------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------------------------------------------------
      # CMake + Ninja (for :lib:native's Rust build)
      # -----------------------------------------------------------------------
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      # -----------------------------------------------------------------------
      # Gradle
      # -----------------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # -----------------------------------------------------------------------
      # Rename to a versioned, traceable name
      # -----------------------------------------------------------------------
      - name: Rename APK with version and short commit SHA
        id: rename
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="$(grep '^projectVersionName' gradle.properties | sed 's/.*=//')"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/nepali-keyboard-v${VERSION}-${SHORT_SHA}.apk"
          ls -l dist

      # -----------------------------------------------------------------------
      # Verify the APK
      # -----------------------------------------------------------------------
      - name: Verify the APK
        run: |
          set -euo pipefail
          APK="dist/nepali-keyboard-v${{ steps.rename.outputs.version }}-${{ steps.rename.outputs.short_sha }}.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            exit 1
          fi

          SIZE=$(stat -c '%s' "$APK")
          echo "APK size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::APK is under 1 MB; assets were probably not packaged"
            exit 1
          fi

          if ! unzip -l "$APK" > /dev/null; then
            echo "::error::APK is not a readable zip archive"
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'classes.dex'; then
            echo "::error::APK contains no classes.dex"
            exit 1
          fi

          echo "APK verified: valid zip, contains classes.dex"

      # -----------------------------------------------------------------------
      # Upload artifact
      # -----------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nepali-keyboard-v${{ steps.rename.outputs.version }}-${{ steps.rename.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Publish GitHub Release
  #
  # Runs after every successful push build, on any branch. `main` publishes a
  # full release; any other branch publishes a prerelease, so the release feed
  # stays usable and `releases/latest` — the endpoint the in-app updater
  # polls — keeps pointing at main-line builds only.
  #
  # A separate job rather than more steps in `build`, because creating a
  # release needs `contents: write` and nothing that compiles code should
  # hold it. The APK is handed over through the uploaded artifact, so this
  # job never runs Gradle and cannot produce a different binary than the one
  # the build job verified.
  # -------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nepali-keyboard-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-${{ needs.build.outputs.short_sha }}
          name: Nepali Keyboard v${{ needs.build.outputs.version }}
          body: |
            ## Nepali Keyboard v${{ needs.build.outputs.version }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ### Installation
            Download the APK below and install it directly. The app includes
            an in-app updater that will check for newer releases automatically.

            ### What's included
            - Native Devanagari layout
            - Romanized Nepali transliteration
            - Full English QWERTY
            - Emoji panel with search
            - Clipboard history
            - Glide typing, themes, and extensive settings (FlorisBoard base)
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
