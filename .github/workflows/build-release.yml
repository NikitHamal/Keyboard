# =============================================================================
# BUILD & RELEASE
# =============================================================================
#
# This workflow is the project's only compiler.
#
# The development environment for this repository deliberately has no Android
# SDK and no Gradle daemon, so nothing here can be built — or even type-checked
# — locally. Every claim that "the project compiles" is therefore backed by a
# green run of this file and by nothing else. Keep it that way: do not add steps
# that assume a local toolchain, and do not let a fast path skip a step that
# catches a real class of error.
#
# It runs on:
#   * every push to main            — the authoritative artifact
#   * every pull request            — the gate
#   * workflow_dispatch             — for an on-demand build from any branch
#
# The job produces exactly ONE release APK, signed with the checked-in demo key.
# See the "Release signing" section of AGENTS.md for why that is safe and what
# its limits are.
# =============================================================================

name: Build release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege. This job reads the repository and uploads an artifact; it
# never writes to the repo, never comments, and never needs a token with more
# reach than that. Setting it here rather than per-step means the default for
# the whole workflow is the restrictive one, which is what you want when a new
# step is added by someone who has not read this header.
permissions:
  contents: read

# A push that supersedes an in-flight build for the same branch cancels the
# older one. Release builds are slow (minify + resource shrink) and a
# superseded run's artifact is by definition not what anyone wants.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      #
      # Full history is not needed. `fetch-depth: 1` keeps the clone fast, and
      # the short SHA used in the artifact name comes from `github.sha` rather
      # than from `git rev-parse`, so a shallow clone is sufficient.
      # -----------------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # Source hygiene gates
      #
      # These run BEFORE the JDK and Gradle setup on purpose. They are pure
      # Python, take under a second, and they can catch the two classes of error
      # that would otherwise only surface as a confusing compiler message thirty
      # seconds into the Gradle run:
      #
      #   * kotlin_lint.py    — unbalanced delimiters, package/directory
      #                         mismatches, and leftover scaffold markers
      #   * kotlin_refcheck.py — names referenced but never declared, and
      #                         imports that resolve to nothing
      #
      # Failing fast here means a typo costs ten seconds rather than a full
      # dependency download. Both scripts are part of the repository and are
      # themselves reviewed; they are not a substitute for the compiler, and the
      # Gradle step below still runs unconditionally when they pass.
      # -----------------------------------------------------------------------
      - name: Set up Python for source checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint Kotlin sources (structure and placeholders)
        run: python tools/kotlin_lint.py

      - name: Cross-check Kotlin references and imports
        run: python tools/kotlin_refcheck.py

      # -----------------------------------------------------------------------
      # JDK 21
      #
      # 21 rather than 17, even though the project compiles to JVM 17 bytecode.
      # AGP 8.7 requires 17 as a minimum and is fully supported on 21; the
      # Gradle daemon on 21 is measurably faster for a minified release build,
      # and using a single modern LTS avoids the class of failure where the
      # toolchain that builds differs from the one CI starts.
      #
      # The distribution is the Temurin LTS build: it is the one the Android
      # Gradle Plugin's own CI uses, so an AGP regression that only appears on
      # another vendor's JDK is not something we will be first to discover.
      # -----------------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # -----------------------------------------------------------------------
      # Gradle
      #
      # `gradle/actions/setup-gradle` rather than a bare `gradle` invocation:
      # it installs the wrapper validation, enables the dependency cache and the
      # configuration cache, and writes the build scan summary that makes a
      # failed run diagnosable from the PR page.
      #
      # `validate-wrappers: true` is the important part. It verifies that the
      # `gradle-wrapper.jar` in the repository matches the published checksum
      # for the version named in `gradle-wrapper.properties`. A tampered wrapper
      # is one of the few supply-chain attacks that a normal build would not
      # notice, because the wrapper is what fetches and runs everything else.
      # -----------------------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false

      # -----------------------------------------------------------------------
      # Build
      #
      # One command, one task, one artifact.
      #
      # `assembleRelease` builds the single universal APK. There is no
      # flavour matrix and no per-ABI split: the app ships no native code, so
      # splitting would produce identical APKs with different names. Exactly one
      # artifact is a deliberate property of this repository — it makes "the
      # build output" an unambiguous thing to point at, and it means the
      # artifact-verification step below can assert its existence by name.
      #
      # `--no-daemon` because the runner is single-use. A daemon would be
      # started, used once, and then either killed by the runner's cleanup or
      # left holding a JVM that the next phase has to account for. The startup
      # cost it would save is paid once and is small next to the dependency
      # download; what it buys is that the build's memory settings are the ones
      # in `gradle.properties`, not whatever a stale daemon was started with.
      #
      # `--stacktrace` so that a ProGuard/R8 failure shows the rule that caused
      # it rather than only the obfuscated symptom.
      #
      # NOTE: no `clean`. The checkout is fresh, so there is nothing stale to
      # remove, and `clean` on a cold Gradle cache only invalidates the
      # configuration cache for no benefit.
      # -----------------------------------------------------------------------
      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # -----------------------------------------------------------------------
      # Rename to a versioned, traceable name
      #
      # The Gradle output is always `app-release.apk`. Two builds from different
      # commits would therefore produce artifacts indistinguishable by name,
      # which is exactly the situation a "which APK is this?" bug report is made
      # of. The version plus the short SHA fixes that, matching the
      # `name-v{version}-{hash}` convention used by sibling projects.
      #
      # `git rev-parse --short HEAD` rather than a substring of `github.sha`:
      # the two agree in practice, but the git command is the definition of the
      # short SHA and stays correct if the checkout depth or the GitHub payload
      # ever changes.
      # -----------------------------------------------------------------------
      - name: Rename APK with version and short commit SHA
        id: rename
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName\s*=\s*"\(.*\)"/\1/')"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/nepali-keyboard-v${VERSION}-${SHORT_SHA}.apk"
          ls -l dist

      # -----------------------------------------------------------------------
      # Verify the artifact before it is published
      #
      # Three assertions, each of which catches a failure mode that would
      # otherwise be discovered by a user installing a broken APK:
      #
      #   1. The file exists and is non-trivially sized. An APK under 1 MB means
      #      the assets were dropped — the lexicon is ~200 KB and the two fonts
      #      are larger than that on their own, so a small APK is a build that
      #      silently lost its data.
      #   2. The APK is a valid zip. `unzip -l` on a truncated or corrupted
      #      output fails here rather than on a phone.
      #   3. `classes.dex` is present. A resource-only archive can still be a
      #      valid zip; without a dex there is nothing to run.
      #
      # The signature is deliberately NOT verified here. `apksigner` would need
      # the Android SDK build-tools, which is a large download for an assertion
      # that R8 cannot pass without a signing config — a release build fails
      # outright if `signingConfig` is missing. The check would be redundant.
      # -----------------------------------------------------------------------
      - name: Verify the APK
        run: |
          set -euo pipefail
          APK="dist/nepali-keyboard-v${{ steps.rename.outputs.version }}-${{ steps.rename.outputs.short_sha }}.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            exit 1
          fi

          SIZE=$(stat -c '%s' "$APK")
          echo "APK size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::APK is under 1 MB; assets were probably not packaged"
            exit 1
          fi

          if ! unzip -l "$APK" > /dev/null; then
            echo "::error::APK is not a readable zip archive"
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'classes.dex'; then
            echo "::error::APK contains no classes.dex"
            exit 1
          fi

          echo "APK verified: valid zip, contains classes.dex"

      # -----------------------------------------------------------------------
      # Publish
      #
      # One artifact, containing one APK, named like the file it holds:
      # `nepali-keyboard-v{version}-{short_sha}`. `if-no-files-found: error`
      # turns "the build produced nothing" into a failed step rather than a
      # silent success with an empty download — which is the single most
      # common way a CI pipeline ends up lying about what it did.
      #
      # `retention-days: 30` keeps the artifact store bounded. These are demo
      # builds of a public demo key; the useful life of the artifact is the
      # length of the PR conversation about it, not a release cycle.
      # -----------------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nepali-keyboard-v${{ steps.rename.outputs.version }}-${{ steps.rename.outputs.short_sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
