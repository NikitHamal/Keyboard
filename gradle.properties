# Project-wide Gradle settings.

# JVM args tuned for CI runners (GitHub Actions ubuntu-latest has ~7GB RAM).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Disable the configuration cache: the Kotlin/Compose/R8 toolchain combination
# is inconsistent about cache serialization and a flaky cache is worse than none.
org.gradle.configuration-cache=false
